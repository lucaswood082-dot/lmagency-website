<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agency Dashboard — LMagency</title>
<meta name="robots" content="noindex">

<!-- Favicon -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>

<header class="app-header">
  <div class="container app-header-inner">
    <a href="/" class="logo">LMagency</a>
    <div class="header-right">
      <span class="page-label">Agency dashboard</span>
      <button type="button" class="link-btn" id="sign-out-btn">Sign out</button>
    </div>
  </div>
</header>

<main class="app-main">
  <div class="app-shell-wide" id="loading-shell">
    <p class="loading-text">Loading dashboard…</p>
  </div>

  <nav class="dash-subnav" id="dashboard-subnav" hidden aria-label="Dashboard sections">
    <a href="#applications-section">Applications</a>
    <a href="#clients-section">Clients</a>
    <a href="#submissions-section">Submissions</a>
  </nav>

  <div class="app-shell-wide" id="dashboard-content" hidden>

    <section class="dash-section" id="applications-section">
      <div class="dash-section-head">
        <div class="heading-group">
          <p class="eyebrow">Review &amp; invite</p>
          <h2>Applications</h2>
        </div>
        <span class="count" id="applications-count"></span>
      </div>
      <div class="record-list" id="applications-list"></div>
    </section>

    <section class="dash-section" id="clients-section">
      <div class="dash-section-head">
        <div class="heading-group">
          <p class="eyebrow">Manage access</p>
          <h2>Clients</h2>
        </div>
        <span class="count" id="clients-count"></span>
      </div>
      <div class="record-list" id="clients-list"></div>
    </section>

    <section class="dash-section" id="submissions-section">
      <div class="dash-section-head">
        <div class="heading-group">
          <p class="eyebrow">Content requests</p>
          <h2>Submissions</h2>
        </div>
        <span class="count" id="submissions-count"></span>
      </div>
      <div id="submissions-groups"></div>
    </section>

  </div>
</main>

<!-- Custom confirmation modal (replaces native confirm()) -->
<div class="modal-overlay" id="confirm-modal" hidden>
  <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-title">
    <p class="modal-title" id="confirm-modal-title">Are you sure?</p>
    <p class="modal-message" id="confirm-modal-message"></p>
    <div class="modal-actions">
      <button type="button" class="btn-tiny" id="confirm-modal-cancel">Cancel</button>
      <button type="button" class="btn-tiny is-danger" id="confirm-modal-confirm">Delete</button>
    </div>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
