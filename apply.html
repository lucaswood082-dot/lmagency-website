<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply — LMagency</title>
<meta name="description" content="Apply to work with LMagency. Tell us about your fitness or wellness brand and we'll be in touch.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>

<header class="app-header">
  <div class="container app-header-inner">
    <a href="/" class="logo">LMagency</a>
    <div class="header-right">
      <span class="page-label">Apply to work with us</span>
    </div>
  </div>
</header>

<main class="app-main">
  <div class="app-shell">
    <div class="app-heading">
      <p class="eyebrow">Let's see if we're a fit</p>
      <h1>Apply for a free trial batch.</h1>
      <p>Tell us a bit about your business. We review every application and get back to
        everyone within a couple of business days.</p>
    </div>

    <form class="panel" id="apply-form" novalidate>
      <div id="apply-fields">
        <div class="field-row">
          <label for="business_name">Business name</label>
          <input type="text" id="business_name" name="business_name" required autocomplete="organization">
        </div>
        <div class="field-row">
          <label for="contact_email">Email</label>
          <input type="email" id="contact_email" name="contact_email" required autocomplete="email">
        </div>
        <div class="field-row">
          <label for="instagram_handle">Instagram handle <span class="hint">(optional)</span></label>
          <input type="text" id="instagram_handle" name="instagram_handle" placeholder="@yourbrand" autocomplete="off">
        </div>
        <div class="field-row">
          <label for="desired_weekly_posts">How many posts per week are you thinking? <span class="hint">(optional)</span></label>
          <input type="number" id="desired_weekly_posts" name="desired_weekly_posts" min="0" step="1" inputmode="numeric">
        </div>
        <fieldset class="field-row checkbox-fieldset">
          <legend>What type of content are you interested in? <span class="hint">(select all that apply)</span></legend>
          <div class="checkbox-group">
            <label class="checkbox-option"><input type="checkbox" name="content_types_interested" value="Transformation"> Transformation</label>
            <label class="checkbox-option"><input type="checkbox" name="content_types_interested" value="Educational"> Educational</label>
            <label class="checkbox-option"><input type="checkbox" name="content_types_interested" value="Promo"> Promo</label>
            <label class="checkbox-option"><input type="checkbox" name="content_types_interested" value="Community"> Community</label>
          </div>
        </fieldset>
        <div class="field-row">
          <label for="goals">What are you hoping to get out of this? <span class="hint">(optional)</span></label>
          <textarea id="goals" name="goals" rows="3"></textarea>
        </div>
        <div class="field-row">
          <label for="message">Anything else we should know? <span class="hint">(optional)</span></label>
          <textarea id="message" name="message" rows="4"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="apply-submit">Submit application</button>
        </div>
      </div>
      <p class="notice" id="apply-notice" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>

<script type="module" src="js/apply.js"></script>
</body>
</html>
